name: Browser checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run check
      - name: Run browser tests
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/browser-tests.log" 2>&1
          test_status=$?
          cat "$RUNNER_TEMP/browser-tests.log"
          if [ "$test_status" -ne 0 ]; then
            TEST_LOG_PATH="$RUNNER_TEMP/browser-tests.log" python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path(os.environ['TEST_LOG_PATH']).read_text().splitlines()
          failures = []
          for index, line in enumerate(lines):
              if not line.startswith('not ok '):
                  continue
              end = index + 1
              while end < len(lines) and not lines[end].startswith(('# Subtest:', 'ok ', 'not ok ', '1..')):
                  end += 1
              failures.extend(lines[index:end])
          summary = [line for line in lines if line.startswith(('# tests ', '# pass ', '# fail ', '# duration_ms '))]
          message = '\n'.join(failures or lines[-100:])[:24000] + '\n' + '\n'.join(summary)
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Browser test failure::' + message)
          PY
          fi
          exit "$test_status"
        env:
          TEST_BROWSER: ${{ matrix.browser }}
